<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>⚙️ Paramètres MQTT</h2>

<form class="card" id="MqttForm" autocomplete="off" onsubmit="event.preventDefault(); SaveMQTT();">

    <p>
    <label>Activer MQTT :</label>
        <input type="checkbox" id="MqttEnable">
    </p>

    <hr>

    <p>
    <label>Serveur MQTT :</label><br>
        <input type="text" id="MqttServer" placeholder="192.168.1.10">
        <small>Nom d’hôte ou adresse IP du broker, sans préfixe mqtt://.</small>
    </p>

    <p>
    <label>Port :</label><br>
        <input type="number" id="MqttPort" disabled>
    </p>

    <p>
    <label>Nom d'utilisateur :</label><br>
        <input type="text" id="MqttUser" placeholder="MQTT Username" autocomplete="off">
    </p>

    <p>
    <label>Mot de passe :</label><br>
        <input type="password" id="MqttPassword" placeholder="Laisser vide pour conserver" autocomplete="new-password">
        <small>Le mot de passe enregistré n’est jamais renvoyé par le serveur.</small>
    </p>

    <p>
        <label>
            <input type="checkbox" id="ClearMqttPassword">
            Effacer le mot de passe MQTT enregistré
        </label>
    </p>

    <hr>

    <p>
    <label>Nom de l'appareil :</label><br>
        <input type="text" id="MqttName" placeholder="Device Name">
    </p>

    <div>
        <button type="submit" id="SaveBtn" class="btn btn-green">💾 Enregistrer</button>
        <button type="button" id="CancelBtn" class="btn btn-gray" onclick="UndoMQTT()">↩️ Annuler</button>
    </div>

</form>

<div class="card">
  <h3>📡 État de la connexion</h3>

  <div class="info-line">
    <div>État :</div>
    <span id="Connected">--</span>
  </div>

</div>

<!-- ⬅ Retour -->
<div class="card">
  <button class="btn btn-gray" onclick="window.history.back()">⬅ Retour</button>
</div>

<script src="/ConfigurationLimits.js"></script>
<script src="/WebSocketClient.js"></script>
<script>
const MqttEnable   = document.getElementById("MqttEnable");
const MqttServer   = document.getElementById("MqttServer");
const MqttPort     = document.getElementById("MqttPort");
const MqttUser     = document.getElementById("MqttUser");
const MqttPassword = document.getElementById("MqttPassword");
const ClearMqttPassword = document.getElementById("ClearMqttPassword");
const MqttName     = document.getElementById("MqttName");
const MqttConnected = document.getElementById("Connected");

const SaveBtn      = document.getElementById("SaveBtn");
const CancelBtn    = document.getElementById("CancelBtn");

let UserChanged = false;
let mqttPortLimits = null;

// Détecter les changements
[MqttEnable, MqttServer, MqttPort, MqttUser, MqttPassword, ClearMqttPassword, MqttName].forEach(el => {
  el.addEventListener("input", () => { UserChanged = true; SaveBtn.disabled = !UserChanged; CancelBtn.disabled = !UserChanged; });
  el.addEventListener("change", () => { UserChanged = true; SaveBtn.disabled = !UserChanged; CancelBtn.disabled = !UserChanged; });
});

// Charger les valeurs depuis le ESP32
let LastGlobalStatus = null;
function LoadMQTT(d) {
  if (d) LastGlobalStatus = d;
  else d = LastGlobalStatus;
  if (!d) return;
    mqttPortLimits = d.Limits && d.Limits.MqttPort;
    applyNumericLimits(MqttPort, mqttPortLimits);

    if (!UserChanged) {
      MqttEnable.checked   = d.Mqtt.MqttEnable;
      MqttServer.value     = d.Mqtt.mqtt_server;
      MqttPort.value       = d.Mqtt.mqtt_server_port;
      MqttUser.value       = d.Mqtt.MQTTUSER;
      MqttPassword.value   = "";
      ClearMqttPassword.checked = false;
      MqttName.value       = d.Mqtt.NAME;
    }

    MqttConnected.innerText = d.Mqtt.Connected ? "Connecté" : "Non connecté";
    MqttConnected.style.color = d.Mqtt.Connected ? "green" : "red";

    if (!UserChanged) {
      SaveBtn.disabled = true;
      CancelBtn.disabled = true;
    }
}



// Sauvegarder les paramètres MQTT
function SaveMQTT() {
  const mqttPort = MqttPort.valueAsNumber;
  if (!Number.isInteger(mqttPort) || !isWithinNumericLimits(mqttPort, mqttPortLimits)) {
    const portRange = mqttPortLimits
      ? formatNumericLimits(mqttPortLimits)
      : "indisponibles";
    alert(`Le port MQTT doit être un entier compris entre ${portRange}.`);
    return;
  }

  const payload = {
    enabled: MqttEnable.checked,
    server: MqttServer.value,
    port: mqttPort,
    user: MqttUser.value,
    deviceName: MqttName.value,
    clearPassword: ClearMqttPassword.checked
  };
  if (MqttPassword.value) payload.password = MqttPassword.value;

  SmartCellarWebSocket.request("saveMqttSettings", payload)
  .then(async result => {
    if (!result.persisted) throw new Error("Les paramètres MQTT n'ont pas été enregistrés.");
    UserChanged = false;
    SaveBtn.disabled = true;
    CancelBtn.disabled = true;
    alert("Paramètres MQTT enregistrés. Redémarrage de l'appareil…");
    await SmartCellarWebSocket.request("restartDevice", {});
  })
  .catch(err => {
    console.error("Erreur lors de la sauvegarde MQTT :", err);
    alert(err.message || "Erreur de communication avec le serveur.");
  });
}

// Annuler les modifications
function UndoMQTT() {
  UserChanged = false;
  LoadMQTT();
}

SmartCellarWebSocket.onState(LoadMQTT);

</script>
</body>
</html>
