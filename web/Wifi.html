<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>📶 Configuration WiFi</h2>

<!-- 📡 État WiFi -->
<div class="card">
  <h3>📡 État de la connexion</h3>

  <div class="info-line">
    <div>État :</div>
    <span id="Connected">--</span>
  </div>

  <div class="info-line">
    <div>Réseau :</div>
    <span id="CurrentSSID">--</span>
  </div>

  <div class="info-line">
    <div>Signal :</div>
    <span><span id="Rssi">--</span> dBm</span>
  </div>

  <div class="info-line">
    <div>IP locale :</div>
    <span id="Ip">--</span>
  </div>
</div>

<!-- 🔍 Scan WiFi -->
<form class="card" id="WifiForm" autocomplete="off" onsubmit="event.preventDefault(); SaveWifi();">
  <h3>🔍 Réseaux disponibles</h3>
  <button type="button" class="btn btn-blue" id="ScanBtn" onclick="ScanWifi()">🔍 Scanner WiFi</button>
  <div id="ScanSpinner" class="spinner"></div>
  <p id="ScanStatus" class="hidden">Scan en cours...</p>
  <select id="Ssid" autocomplete="off"></select>
  <!-- Identifiant caché attendu par les navigateurs pour un formulaire avec mot de passe. -->
  <input type="text" id="SsidUsername" autocomplete="username" readonly hidden>
  <input type="password" id="Pass" placeholder="Mot de passe" autocomplete="new-password">
  <button type="submit" class="btn btn-blue">💾 Enregistrer</button>
</form>



<!-- ⬅ Retour -->
<div class="card">
  <button class="btn btn-gray" onclick="window.history.back()">⬅ Retour</button>
</div>

<script src="/WebSocketClient.js"></script>
<script>
const ScanButton = document.getElementById("ScanBtn");
const ScanSpinner = document.getElementById("ScanSpinner");
const ScanStatus = document.getElementById("ScanStatus");
const SsidSelect = document.getElementById("Ssid");
const PasswordInput = document.getElementById("Pass");
const SsidUsername = document.getElementById("SsidUsername");
let scanInProgress = false;

function syncSsidUsername() {
  SsidUsername.value = SsidSelect.value;
}
SsidSelect.addEventListener("change", syncSsidUsername);

function setScanInProgress(active, message) {
  scanInProgress = active;
  ScanButton.disabled = active;
  ScanButton.style.opacity = active ? 0.6 : 1;
  ScanSpinner.style.display = active ? "block" : "none";
  ScanStatus.classList.toggle("hidden", !active && !message);
  if (message) ScanStatus.textContent = message;
  else if (active) ScanStatus.textContent = "Scan en cours...";
}

function displayScanResults(networks) {
  SsidSelect.replaceChildren();
  networks.forEach(network => {
    if (!network || typeof network.ssid !== "string") return;
    const option = document.createElement("option");
    option.value = network.ssid;
    option.textContent = `${network.ssid} (${network.rssi} dBm)${network.secure ? " 🔒" : ""}`;
    SsidSelect.appendChild(option);
  });
  syncSsidUsername();
  setScanInProgress(false);
  ScanStatus.classList.add("hidden");
}

async function refreshScanResults() {
  try {
    const result = await SmartCellarWebSocket.request("getWifiScanResults", {});
    if (result.scanning) {
      setScanInProgress(true);
    } else if (result.hasResults && Array.isArray(result.networks)) {
      displayScanResults(result.networks);
    } else if (scanInProgress) {
      setScanInProgress(false);
    }
  } catch (error) {
    console.error("Impossible de récupérer les résultats du scan Wi-Fi :", error);
  }
}

async function ScanWifi() {
  setScanInProgress(true);
  try {
    await SmartCellarWebSocket.request("scanWifi", {});
  } catch (error) {
    console.error("Erreur de lancement du scan Wi-Fi :", error);
    if (error.code !== "connection_lost" && error.code !== "timeout") {
      setScanInProgress(false, error.message);
    }
  }
}

async function SaveWifi() {
  if (SsidSelect.value === "" || PasswordInput.value === "") {
    alert("⚠️ Veuillez renseigner le SSID et le mot de passe.");
    return;
  }

  try {
    const result = await SmartCellarWebSocket.request("saveWifiSettings", {
      ssid: SsidSelect.value,
      password: PasswordInput.value
    });
    if (!result.persisted) throw new Error("Les paramètres Wi-Fi n'ont pas été enregistrés.");
    alert("Paramètres Wi-Fi enregistrés. Redémarrage de l'appareil…");
    await SmartCellarWebSocket.request("restartDevice", {});
  } catch (error) {
    console.error("Erreur lors de la sauvegarde Wi-Fi :", error);
    alert(error.message || "Erreur de communication avec le serveur.");
  }
}

function UpdateWifiInfo(data) {
  if (!data || !data.Wifi) return;
  const connected = data.Wifi.Connected;
  document.getElementById("Connected").innerText = connected ? "Connecté" : "Non connecté";
  document.getElementById("Connected").style.color = connected ? "green" : "red";
  document.getElementById("CurrentSSID").innerText = data.Wifi.Ssid || "--";
  document.getElementById("Rssi").innerText = connected ? data.Wifi.Rssi : "--";
  document.getElementById("Ip").innerText = connected ? data.Wifi.Ip : "--";
}

SmartCellarWebSocket.onState(UpdateWifiInfo);
SmartCellarWebSocket.onEvent("wifiScanComplete", event => {
  displayScanResults(event.payload && Array.isArray(event.payload.networks)
    ? event.payload.networks
    : []);
});
SmartCellarWebSocket.onEvent("wifiScanFailed", event => {
  const message = event.payload && event.payload.message
    ? event.payload.message
    : "Le scan Wi-Fi a échoué.";
  setScanInProgress(false, message);
});
SmartCellarWebSocket.onConnection(connected => {
  if (connected) refreshScanResults();
});
</script>

</body>
</html>
