<h2>📶 Configuration WiFi</h2>

<!-- 📡 État WiFi -->
<div class="card">
  <h3>📡 État de la connexion</h3>

  <div class="info-line">
    <div>État :</div>
    <span id="Connected">--</span>
  </div>

  <div class="info-line">
    <div>Réseau :</div>
    <span id="CurrentSSID">--</span>
  </div>

  <div class="info-line">
    <div>Signal :</div>
    <span><span id="Rssi">--</span> dBm</span>
  </div>

  <div class="info-line">
    <div>IP locale :</div>
    <span id="Ip">--</span>
  </div>
</div>

<!-- 🔍 Scan WiFi -->
<div class="card">
  <h3>🔍 Réseaux disponibles</h3>
  <button class="btn btn-blue" id="ScanBtn" onclick="ScanWifi()">🔍 Scanner WiFi</button>
  <div id="ScanSpinner" class="spinner"></div>
  <p id="ScanStatus" class="hidden">Scan en cours...</p>
  <select id="Ssid"></select>
  <input type="password" id="Pass" placeholder="Mot de passe">
  <button class="btn btn-blue" onclick="SaveWifi()">💾 Enregistrer</button>
</div>



<!-- ⬅ Retour -->
<div class="card">
  <button class="btn btn-gray" onclick="window.history.back()">⬅ Retour</button>
</div>

<script>

async function ScanWifi() {
  const Btn = document.getElementById("ScanBtn");
  const Spinner = document.getElementById("ScanSpinner");
  const Status = document.getElementById("ScanStatus");

  Btn.disabled = true;
  Btn.style.opacity = 0.6;
  Status.classList.remove("hidden");
  Spinner.style.display = "block";

  try {
    const scanResponse = await fetch("/Scan", { method: "POST" });
    if (!scanResponse.ok) {
      throw new Error(await scanResponse.text());
    }
  } catch (err) {
    console.error("Erreur de lancement du scan:", err);
    Btn.disabled = false;
    Btn.style.opacity = 1;
    Spinner.style.display = "none";
    Status.classList.add("hidden");
    return;
  }

  // Étape 2 : On vérifie périodiquement les résultats
  const checkResults = setInterval(async () => {
    try {
      const response = await fetch("/GetScanResults");
      if (!response.ok) {
        throw new Error(await response.text());
      }
      const text = await response.text();

      if (text !== "WAITING" && text !== "NOT_STARTED") {
        // Le scan est fini, on a reçu les <option>...
        Ssid.innerHTML = text;
        
        // On arrête la boucle et on réactive le bouton
        clearInterval(checkResults);
        Btn.disabled = false;
        Btn.style.opacity = 1;
        Spinner.style.display = "none";
        Status.classList.add("hidden");
      }
    } catch (err) {
      console.error("Erreur de scan:", err);
      clearInterval(checkResults);
      Btn.disabled = false;
    }
  }, 500); // On demande toutes les 1 seconde
}


function SaveWifi(){

  if(Ssid.value === "" || Pass.value === ""){
    alert("⚠️ Veuillez renseigner le SSID et le mot de passe.");
    return; // on stoppe ici
  }

  fetch("/SaveWifi",{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`Ssid=${Ssid.value}&Pass=${Pass.value}`
  })
  .then(async response=> {
    const txt = await response.text();
    if (!response.ok) {
      throw new Error(txt);
    }

    alert(txt);
    const restartResponse = await fetch("/RestartESP", { method: "POST" });
    if (!restartResponse.ok) {
      throw new Error(await restartResponse.text());
    }
  })
  .catch(err => {
      console.error("Erreur lors de la sauvegarde WIFI :", err);
      alert(err.message || "Erreur de communication avec le serveur.");
  });
 
}

function UpdateWifiInfo(){
  fetch("/GlobalStatus")
    .then(r=>r.json())
    .then(d=>{
      Connected.innerText = d.Wifi.Connected ? "Connecté" : "Non connecté";
      Connected.style.color = d.Wifi.Connected ? "green" : "red";
      CurrentSSID.innerText = d.Wifi.Ssid || "--";
      Rssi.innerText = d.Wifi.Connected ? d.Wifi.Rssi : "--";
      Ip.innerText = d.Wifi.Connected ? d.Wifi.Ip : "--";
    });
}


UpdateWifiInfo();
setInterval(UpdateWifiInfo, 1000);

</script>
